[build]
builder = "nixpacks"

[build.nixpacksPlan.phases.setup]
nixPkgs = ["php84", "php84Extensions.pdo_mysql", "php84Extensions.gd", "php84Extensions.mbstring", "php84Extensions.xml", "php84Extensions.curl", "nodejs_22", "npm-10_x"]

[build.nixpacksPlan.phases.install]
cmds = ["composer install --no-dev --optimize-autoloader", "npm ci", "npm run build"]

[deploy]
startCommand = "php artisan migrate --force && php artisan db:seed --force && php artisan optimize && php artisan serve --host=0.0.0.0 --port=$PORT"
healthcheckPath = "/up"
healthcheckTimeout = 300
