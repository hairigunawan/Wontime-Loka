databases:
  - name: wontime-db
    databaseName: wontimedb
    user: wontimeuser
    plan: free

services:
  - type: web
    name: wontime-web
    env: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wontime-db
          property: connectionString
      - key: DB_CONNECTION
        value: pgsql
      - key: APP_NAME
        value: WONTIME
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
